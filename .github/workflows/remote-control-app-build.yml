name: Build Remote Control debug APK

on:
  push:
    branches: [main]
    paths:
      - 'remote-control-app/**'
      - '.github/workflows/remote-control-app-build.yml'
  pull_request:
    paths:
      - 'remote-control-app/**'
      - '.github/workflows/remote-control-app-build.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: remote-control-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: remote-control-debug
          path: remote-control-app/app/build/outputs/apk/debug/app-debug.apk
