name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photo-organizer-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Read version info
        id: version
        run: |
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # 앱 안의 "업데이트 확인" 기능이 GitHub Releases의 태그(v<versionCode>)로 새 버전을
      # 판별하므로, 태그 이름은 반드시 이 규칙(v + versionCode)을 따라야 한다.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.code }}"
          APK="photo-organizer-v${{ steps.version.outputs.code }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" "$APK" \
              --repo "${{ github.repository }}" \
              --title "v${{ steps.version.outputs.name }}" \
              --notes "자동 빌드된 업데이트 (versionCode ${{ steps.version.outputs.code }})"
          fi
